name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: puetech_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migraciones consistentes
        run: npx drizzle-kit check
      # Sin DATABASE_URL a propósito: el build no debe necesitar base de datos.
      - run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run e2e
        env:
          CI: "true"
          E2E_DATABASE_URL: postgres://postgres@localhost:5432/puetech_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
